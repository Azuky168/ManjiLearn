let AC;const tone=(f,d=.08,ty="sine",v=.15,t0=0)=>{if(!S.snd||!S.vs)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v*S.vs*2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};
const sfx={click:()=>tone(520,.06,"triangle"),pop:()=>tone(780,.09,"sine",.18),ok:()=>{tone(660,.1);tone(880,.12,"sine",.15,.09);tone(1320,.2,"sine",.12,.18)},ko:()=>{tone(220,.18,"sawtooth",.1);tone(160,.25,"sawtooth",.1,.15)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.15,i*.1))};
const burst=(x,y,n=8)=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<n;i++){const p=document.createElement("i"),a=Math.random()*6.28,d=40+Math.random()*80;p.className="pt";p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${["var(--ac)","var(--fg)","#ffc83d"][i%3]}`;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}};
const shk=()=>{const m=$("#m");m.classList.remove("shk");void m.offsetWidth;m.classList.add("shk")};
addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(b&&!b.disabled){sfx.click();burst(e.clientX,e.clientY,6)}});
const RS={fav:["Favoris",["fav","fw"]],mots:["Mots",["lw","wi","st","pz","rem"]],kana:["Écritures apprises",["lk"]],quiz:["Quiz et jeu",["res","wr","best","ev"]],perso:["Quiz perso",["cq","ph"]],lect:["Lectures",["rf"]],serie:["Séries",["str","bst","last","days"]],chat:["Sensei",["chat"]],th:["Thème",["th","cu"]]};
const rst=k=>{if(!confirm("Réinitialiser : "+(k=="all"?"tout":RS[k][0])+" ?"))return;(k=="all"?Object.keys(DEF):RS[k][1]).forEach(x=>S[x]=JSON.parse(JSON.stringify(DEF[x])));S.st=Date.now();save();theme();me()};
/* Profil */
function me(){const c=t=>ALL.filter(k=>k.t==t&&S.lk[k.t+k.c]).length,n=t=>ALL.filter(k=>k.t==t).length,w=["D","L","M","M","J","V","S"],s=cur();
const wr=Object.keys(S.wr).sort((a,b)=>S.wr[b]-S.wr[a]).slice(0,12).map(x=>x.slice(1));
$("#m").innerHTML=`<h1>Profil</h1><div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-end;margin:0"><div class="big" style="text-align:left">${s}</div>${fl(s)}</div><b>${s>1?"jours":"jour"} d’affilée</b><div class="mu">${S.last==dy()?"Journée validée.":"Fais une activité pour valider ta journée."} Record : ${S.bst}</div>
<div class="dots">${[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);return`<div class="dot ${S.days.includes(dy(o))?"on":""}">${w[d.getDay()]}</div>`}).join("")}</div></div>
<div class="card">${["h","k","x"].map(t=>`<div class="mu">${NM[t]} ${c(t)} / ${n(t)}</div>${bar(c(t)/n(t)*100)}`).join("")}<div class="mu">Mots appris ${Object.keys(S.lw).length} / ${W.length} · Quiz ${S.res.length}</div></div>
<div class="card"><b>À retravailler</b><div class="row">${wr.map(x=>`<span style="font-size:1.7rem">${x}</span>`).join("")||'<span class="mu">Rien pour l’instant.</span>'}</div></div>
<h2>Thèmes</h2>`+[["sakura","Sakura","#fff3f5","#e8335a"],["nuit","Nuit","#0e1220","#7c9cff"],["matcha","Matcha","#eaf2dc","#3b7a1c"],["encre","Encre","#fff","#000"]].map(x=>`<button class="sw" onclick="S.th='${x[0]}';save();theme();me()"><i style="background:linear-gradient(90deg,${x[2]} 50%,${x[3]} 50%)"></i>${x[1]}${S.th==x[0]?" ✓":""}</button>`).join("")+
`<div class="card"><b>Personnalisé</b>${[["bg","Fond"],["cd","Cartes"],["fg","Texte"],["ac","Accent"]].map(x=>`<label>${x[1]}<input type="color" value="${S.cu[x[0]]}" oninput="S.cu.${x[0]}=this.value;S.th='perso';save();theme()"></label>`).join("")}<button class="p w" onclick="S.th='perso';save();me()">${S.th=="perso"?"Thème perso actif ✓":"Activer mon thème"}</button></div>
<button class="w ${S.snd?"on":""}" onclick="S.snd=S.snd?0:1;save();me()">Bruitages ${S.snd?"activés":"désactivés"}</button><div class="card"><label>Volume des bruitages<input type="range" min="0" max="100" value="${Math.round(S.vs*100)}" aria-label="Volume des bruitages" oninput="S.vs=this.value/100;save()" onchange="sfx.ok()"></label><label>Volume des voix<input type="range" min="0" max="100" value="${Math.round(S.vv*100)}" aria-label="Volume des voix" oninput="S.vv=this.value/100;save()" onchange="say('こんにちは')"></label></div><div class="row s"><button onclick="say('こんにちは')">Tester la voix</button><button onclick="tuto()">Revoir le tutoriel</button></div><div class="mu">${jv("ja-JP")?"Voix japonaise détectée.":"Aucune voix japonaise détectée : le son passera par Internet."}</div><h2>Réinitialiser</h2><div class="card"><div class="row">${Object.keys(RS).map(k=>`<button onclick="rst('${k}')">${RS[k][0]}</button>`).join("")}</div><button class="w" onclick="rst('all')">Tout réinitialiser</button></div>`}
theme();go("home");if(!S.tu)tuto();
</script></body></html>
