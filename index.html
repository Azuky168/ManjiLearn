<div class="dots">${[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);return`<div class="dot ${S.days.includes(dy(o))?"on":""}">${w[d.getDay()]}</div>`}).join("")}</div></div>
<div class="card">${["h","k","x"].map(t=>`<div class="mu">${NM[t]} ${c(t)} / ${n(t)}</div>${bar(c(t)/n(t)*100)}`).join("")}<div class="mu">Mots appris ${Object.keys(S.lw).length} / ${W.length} · Quiz ${S.res.length}</div></div>
<div class="card"><b>À retravailler</b><div class="row">${wr.map(x=>`<span style="font-size:1.7rem">${x}</span>`).join("")||'<span class="mu">Rien pour l’instant.</span>'}</div></div>
<h2>Thèmes</h2>`+[["glassl","Liquid Glass clair","#cfe0ff","#2f6bff"],["glassd","Liquid Glass sombre","#2a2f6e","#7aa7ff"],["sakura","Sakura","#fff3f5","#e8335a"],["nuit","Nuit","#0e1220","#7c9cff"],["matcha","Matcha","#eaf2dc","#3b7a1c"],["encre","Encre","#fff","#000"]].map(x=>`<button class="sw" onclick="S.th='${x[0]}';save();theme();me()"><i style="background:linear-gradient(90deg,${x[2]} 50%,${x[3]} 50%)"></i>${x[1]}${S.th==x[0]?" ✓":""}</button>`).join("")+
`<div class="card"><b>Personnalisé</b>${[["bg","Fond"],["cd","Cartes"],["fg","Texte"],["ac","Accent"]].map(x=>`<label>${x[1]}<input type="color" value="${S.cu[x[0]]}" oninput="S.cu.${x[0]}=this.value;S.th='perso';save();theme()"></label>`).join("")}<button class="p w" onclick="S.th='perso';save();me()">${S.th=="perso"?"Thème perso actif ✓":"Activer mon thème"}</button></div>
<button class="w ${S.snd?"on":""}" onclick="S.snd=S.snd?0:1;save();me()">Bruitages ${S.snd?"activés":"désactivés"}</button><div class="card"><label>Volume des bruitages<input type="range" min="0" max="100" value="${Math.round(S.vs*100)}" aria-label="Volume des bruitages" oninput="S.vs=this.value/100;save()" onchange="sfx.ok()"></label><label>Volume des voix<input type="range" min="0" max="100" value="${Math.round(S.vv*100)}" aria-label="Volume des voix" oninput="S.vv=this.value/100;save()" onchange="say('こんにちは')"></label></div><div class="row s"><button onclick="say('こんにちは')">Tester la voix</button><button onclick="tuto()">Revoir le tutoriel</button></div><div class="mu">${jv("ja-JP")?"Voix japonaise détectée.":"Aucune voix japonaise détectée : le son passera par Internet."}</div><h2>Performance</h2><div class="card"><button class="w ${S.perf?"on":""}" onclick="S.perf=S.perf?0:1;save();theme();me()">Mode performance ${S.perf?"activé":"désactivé"}</button><div class="mu" style="margin-top:6px;line-height:1.5">Coupe les ombres, animations et particules : utile si ton téléphone est lent.</div></div><h2>Mises à jour</h2><div class="card"><div class="mu" style="line-height:1.5">Version installée : ${VER}. Quand tu publies une nouvelle version du site, l’app affiche une bannière « Nouvelle version disponible ».</div><div class="row s"><button class="p" onclick="chkUpd(1)">Vérifier maintenant</button>${"Notification"in window&&Notification.permission!="granted"?`<button onclick="enNotif()">Activer les notifications</button>`:""}</div>${"Notification"in window&&Notification.permission=="granted"?'<div class="mu">Notifications activées : tu es prévenu aussi quand l’app est en arrière-plan.</div>':""}</div><h2>Réinitialiser</h2><div class="card"><div class="row">${Object.keys(RS).map(k=>`<button onclick="rst('${k}')">${RS[k][0]}</button>`).join("")}</div><button class="w" onclick="rst('all')">Tout réinitialiser</button></div>`}

/* Mises à jour : change VER à chaque publication (et la même valeur dans sw.js) */
const VER="2026.10.24.2",WEB=/^https?:/.test(location.protocol);let UB=null,UN="";
function updBanner(v){if(UB||document.getElementById("ub"))return;UB=document.createElement("div");UB.id="ub";UB.setAttribute("role","alert");UB.style.cssText="position:fixed;left:64px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:260;background:var(--ac);color:var(--on);padding:10px 12px;border-radius:16px;display:flex;gap:8px;align-items:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)";
UB.innerHTML=`<span style="flex:1;line-height:1.25">Nouvelle version${v?" "+esc(v):""} disponible</span><button id="ubg" style="background:var(--on);color:var(--ac)">Mettre à jour</button><button id="ubx" aria-label="Plus tard" style="background:none;color:inherit">✕</button>`;
document.body.appendChild(UB);document.getElementById("ubg").onclick=()=>applyUpd(v);document.getElementById("ubx").onclick=()=>{UB.remove();UB=null}}
function updNotify(v){if(v&&v==UN)return;UN=v||UN;updBanner(v);try{if(document.hidden&&"Notification"in window&&Notification.permission=="granted")navigator.serviceWorker.ready.then(r=>r.showNotification("ManjiLearn",{body:"Nouvelle version"+(v?" "+v:"")+" disponible. Ouvre l’app pour la mettre à jour.",icon:"icon-192.png",tag:"manji-update"}))}catch(e){}}
async function applyUpd(v){try{localStorage.manjiupd=v||"1"}catch(e){}try{(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister())}catch(e){}try{(await caches.keys()).forEach(k=>caches.delete(k))}catch(e){}location.reload()}
async function chkUpd(manual){if(!WEB)return;try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const m=(await r.text()).match(/const VER="([^"]+)"/);if(m&&m[1]!=VER){updNotify(m[1]);if(manual)toast("Une nouvelle version est disponible : "+m[1]);return}if(manual)toast("ManjiLearn est à jour (version "+VER+")")}catch(e){if(manual)toast("Impossible de vérifier : pas de connexion.")}}
async function enNotif(){if(!("Notification"in window))return toast("Les notifications ne sont pas disponibles ici.");const p=await Notification.requestPermission();toast(p=="granted"?"Notifications activées":"Notifications refusées");if(p=="granted")try{navigator.serviceWorker.ready.then(r=>r.periodicSync&&r.periodicSync.register("manji-update",{minInterval:864e5}))}catch(e){}if(view=="me")me()}
if("serviceWorker"in navigator&&WEB)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state=="installed"&&navigator.serviceWorker.controller)chkUpd()})});reg.update().catch(()=>{});if(reg.periodicSync&&"Notification"in window&&Notification.permission=="granted")reg.periodicSync.register("manji-update",{minInterval:864e5}).catch(()=>{})}).catch(()=>{})});
if(WEB){try{const u=localStorage.manjiupd;if(u){localStorage.removeItem("manjiupd");setTimeout(()=>toast("Mise à jour installée : version "+VER),900)}}catch(e){}
addEventListener("load",()=>setTimeout(chkUpd,3000));document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkUpd()});setInterval(chkUpd,9e5)}
let IP=null;const inst=()=>{const d=document.createElement("div");d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:250;background:var(--ac);color:var(--on);padding:10px 12px;border-radius:16px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)";d.innerHTML='<span style="flex:1">Installer ManjiLearn sur ton écran d’accueil</span><button id="ib" style="background:var(--on);color:var(--ac)">Installer</button><button id="ix" aria-label="Fermer" style="background:none;color:inherit">✕</button>';document.body.appendChild(d);$("#ix").onclick=()=>d.remove();$("#ib").onclick=()=>{d.remove();IP&&IP.prompt();IP=null}};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();IP=e;inst()});
try{if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone&&!localStorage.manjiios){localStorage.manjiios=1;setTimeout(()=>toast("Pour installer : bouton Partager, puis « Sur l’écran d’accueil »."),2500)}}catch(e){}
