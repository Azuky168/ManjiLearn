$("#m").innerHTML=qtabs()+`<div class="card"><b>Tout ce que tu as appris</b><div class="mu" style="margin:6px 0">Hiragana ${c("h")} · Katakana ${c("k")} · Kanji ${c("x")} · Mots ${ws.length}</div><div class="row">${all.slice(0,60).map(k=>`<span style="font-size:1.4rem">${k.c}</span>`).join("")||'<span class="mu">Rien d’appris pour l’instant. Marque des signes dans Écritures et des mots dans Mots.</span>'}</div>${n>60?`<div class="mu">et ${n-60} autres…</div>`:""}<button class="p w" style="margin-top:10px" ${n<4?"disabled":""} onclick="qstart([...ALL.filter(k=>S.lk[k.t+k.c]),...Object.keys(S.lw).map(i=>WW[i])],1)">Lancer l’évaluation (${n} questions)</button></div><div class="card"><b>Dernières évaluations</b>${S.ev.slice(-5).reverse().map(r=>`<div class="mu">${new Date(r.d).toLocaleDateString("fr-FR")} : ${r.s} / ${r.n}</div>`).join("")||'<div class="mu">Aucune évaluation.</div>'}</div>`}
function df(){$("#m").innerHTML=qtabs()+`<div class="card"><div class="mu">À dessiner</div><div class="row s">${[["h","Hiragana"],["k","Katakana"],["x","Kanji"],["w","Mots"]].map(x=>`<button class="${ds.sc==x[0]?"on":""}" onclick="ds.sc='${x[0]}';df()">${x[1]}</button>`).join("")}</div><div class="mu">Suis le symbole en fond (tu peux le masquer). Tu reçois une note sur 100.</div></div>${nq()}<button class="p w" onclick="dstart()">Commencer</button>`}
function dstart(){const src=ds.sc=="w"?WW:ALL.filter(k=>k.t==ds.sc),l=[];while(l.length<qs.n)l.push(...[...src].sort(()=>Math.random()-.5).slice(0,qs.n-l.length));DR={l,i:0,ok:0,sum:0};dr()}
const FT=fs=>`700 ${fs}px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif`;
function pg(c,t,fs){const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.font=FT(fs);x.textAlign="center";x.textBaseline="middle";x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--fg")||"#000";x.fillText(t,c.width/2,c.height/2)}
function score(t,fs){const N=64,mk=()=>{const c=document.createElement("canvas");c.width=c.height=N;return c},a=mk(),b=mk(),ax=a.getContext("2d"),bx=b.getContext("2d");
ax.font=FT(fs*N/320);ax.textAlign="center";ax.textBaseline="middle";ax.fillText(t,N/2,N/2);bx.drawImage($("#cv"),0,0,N,N);
const T=ax.getImageData(0,0,N,N).data,U=bx.getImageData(0,0,N,N).data,tm=[],um=[];for(let i=0;i<N*N;i++){tm[i]=T[i*4+3]>60;um[i]=U[i*4+3]>25}
const near=(m,i)=>{const x=i%N,y=i/N|0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N&&m[Y*N+X])return 1}return 0};
let tc=0,tn=0,uc=0,un=0;for(let i=0;i<N*N;i++){if(tm[i]){tn++;tc+=near(um,i)}if(um[i]){un++;uc+=near(tm,i)}}
if(!un||!tn)return 0;const p=uc/un,r=tc/tn;return Math.min(100,Math.round(120*p*r))}
const cl=()=>{if(DR&&DR.done)return;const c=$("#cv");c.getContext("2d").clearRect(0,0,c.width,c.height)};
function tgh(){S.gh=S.gh?0:1;save();$("#gh").style.opacity=DR.done?.55:S.gh?.22:0;$("#gb").textContent="Fond : "+(S.gh?"affiché":"masqué")}
function dr(){const k=DR.l[DR.i],fs=Math.min(240,300/[...k.c].length),q=k.t=="x"?k.m+" ("+k.r.split(",")[0]+")":k.t=="w"?k.m+" ("+k.r+")":k.r;DR.done=0;DR.fs=fs;
$("#m").innerHTML=`<h1>Dessin</h1><div class="mu">Question ${DR.i+1} / ${DR.l.length} · Réussis ${DR.ok}</div>${bar(DR.i/DR.l.length*100)}<div class="mid"><b style="font-size:1.4rem">${esc(q)}</b></div>
<div style="position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:12px auto;background:var(--cd);border-radius:20px;overflow:hidden"><canvas id="gh" width="320" height="320" style="position:absolute;inset:0;width:100%;height:100%;opacity:${S.gh?.22:0}"></canvas><canvas id="cv" width="320" height="320" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div>
<div id="sc" class="mid" style="min-height:3.4rem"></div>
<div class="row s"><button onclick="cl()">Effacer</button><button id="gb" onclick="tgh()">Fond : ${S.gh?"affiché":"masqué"}</button><button onclick="say(sp(DR.l[DR.i]))">Écouter</button></div>
<button id="vb" class="p w" onclick="dv()">Valider</button>`;
pg($("#gh"),k.c,fs);const c=$("#cv"),x=c.getContext("2d");x.lineWidth=9;x.lineCap=x.lineJoin="round";x.strokeStyle=(getComputedStyle(document.documentElement).getPropertyValue("--ac")||"#e8335a").trim();let d=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{if(DR.done)return;d=1;c.setPointerCapture(e.pointerId);const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]);x.stroke()};
c.onpointermove=e=>{if(!d)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};c.onpointerup=c.onpointercancel=()=>d=0}
function dv(){const k=DR.l[DR.i],n=score(k.c,DR.fs);DR.done=1;DR.sum+=n;
if(n>=60){DR.ok++;sfx.ok();burst(innerWidth/2,innerHeight/3,18)}else{sfx.ko();S.wr[k.t+k.c]=(S.wr[k.t+k.c]||0)+1;save()}
$("#gh").style.opacity=.55;$("#sc").innerHTML=`<div style="font-size:2.4rem;font-weight:900">${n} / 100</div><div class="mu">${n>=85?"Parfait !":n>=60?"Bien joué.":"Regarde le modèle et réessaie."}</div>`;
const b=$("#vb");b.textContent=DR.i+1<DR.l.length?"Suivant":"Résultat";b.onclick=dn;say(sp(k))}
function dn(){DR.i++;if(DR.i>=DR.l.length){const r=DR;DR=null;act();save();sfx.win();burst(innerWidth/2,innerHeight/3,40);$("#m").innerHTML=`<h1>${Math.round(r.sum/r.l.length)} / 100</h1><div class="card">${r.ok} réussi(s) sur ${r.l.length} (60 et plus).</div><button class="p w" onclick="qt='d';dstart()">Rejouer</button><button class="w" style="margin-top:8px" onclick="quiz()">Retour</button>`;return}dr()}
const fl=s=>{const z=s?Math.min(34+s*2.6,150):34,b=s>=30;return`<svg class="fl" viewBox="0 0 24 32" width="${z*.75}" height="${z}" aria-hidden="true" style="opacity:${s?1:.3}"><path d="M12 1c1 7 9 10 9 20a9 9 0 0 1-18 0c0-6 4-8 5-13 1 2 2 3 3 3 0-4 0-7 1-10z" fill="${b?"#3b9bff":"#ff6a00"}"/><path d="M12 15c1 3 5 4 5 8a5 5 0 0 1-10 0c0-3 3-4 5-8z" fill="${b?"#bfe3ff":"#ffd54a"}"/></svg>`};
const TU=[["Bienvenue sur ManjiLearn","Apprends les hiragana, katakana et kanji à ton rythme. Le menu du bas te mène partout."],["Écritures et Mots","Touche un signe pour l’entendre. En mode « Marquer appris », il compte dans ta progression. Un nouveau mot arrive régulièrement dans Mots."],["Quiz et Dessin","Dans Quiz : classique, perso, évaluation et dessin. En dessin, suis le symbole en fond (tu peux le masquer) et reçois une note sur 100."],["Série et Sensei","Fais une activité par jour pour faire grandir ta flamme. Sensei discute avec toi, à l’écrit ou au micro."]];
function tuto(i=0){let d=document.getElementById("tu");if(!d){d=document.createElement("div");d.id="tu";d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px";document.body.appendChild(d)}
const t=TU[i],last=i+1>=TU.length;d.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><h2 style="margin-top:0">${t[0]}</h2><p style="line-height:1.5;margin-bottom:14px">${t[1]}</p><div class="mu" style="margin-bottom:10px">${i+1} / ${TU.length}</div><div class="row s"><button onclick="tend()">Passer</button><button class="p" onclick="${last?"tend()":"tuto("+(i+1)+")"}">${last?"C’est parti":"Suivant"}</button></div></div>`}
const tend=()=>{S.tu=1;save();const d=document.getElementById("tu");if(d)d.remove()};
/* Effets */
let AC;const tone=(f,d=.08,ty="sine",v=.15,t0=0)=>{if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};
const sfx={click:()=>tone(520,.06,"triangle"),pop:()=>tone(780,.09,"sine",.18),ok:()=>{tone(660,.1);tone(880,.12,"sine",.15,.09);tone(1320,.2,"sine",.12,.18)},ko:()=>{tone(220,.18,"sawtooth",.1);tone(160,.25,"sawtooth",.1,.15)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.15,i*.1))};
const burst=(x,y,n=8)=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<n;i++){const p=document.createElement("i"),a=Math.random()*6.28,d=40+Math.random()*80;p.className="pt";p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${["var(--ac)","var(--fg)","#ffc83d"][i%3]}`;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}};
const shk=()=>{const m=$("#m");m.classList.remove("shk");void m.offsetWidth;m.classList.add("shk")};
addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(b&&!b.disabled){sfx.click();burst(e.clientX,e.clientY,6)}});
const RS={mots:["Mots",["lw","wi","st","pz","rem"]],kana:["Écritures apprises",["lk"]],quiz:["Quiz et jeu",["res","wr","best","ev"]],perso:["Quiz perso",["cq"]],lect:["Lectures",["rf"]],serie:["Séries",["str","bst","last","days"]],chat:["Sensei",["chat"]],th:["Thème",["th","cu"]]};
const rst=k=>{if(!confirm("Réinitialiser : "+(k=="all"?"tout":RS[k][0])+" ?"))return;(k=="all"?Object.keys(DEF):RS[k][1]).forEach(x=>S[x]=JSON.parse(JSON.stringify(DEF[x])));S.st=Date.now();save();theme();me()};
/* Profil */
function me(){const c=t=>ALL.filter(k=>k.t==t&&S.lk[k.t+k.c]).length,n=t=>ALL.filter(k=>k.t==t).length,w=["D","L","M","M","J","V","S"],s=cur();
const wr=Object.keys(S.wr).sort((a,b)=>S.wr[b]-S.wr[a]).slice(0,12).map(x=>x.slice(1));
$("#m").innerHTML=`<h1>Profil</h1><div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-end;margin:0"><div class="big" style="text-align:left">${s}</div>${fl(s)}</div><b>${s>1?"jours":"jour"} d’affilée</b><div class="mu">${S.last==dy()?"Journée validée.":"Fais une activité pour valider ta journée."} Record : ${S.bst}</div>
<div class="dots">${[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);return`<div class="dot ${S.days.includes(dy(o))?"on":""}">${w[d.getDay()]}</div>`}).join("")}</div></div>
<div class="card">${["h","k","x"].map(t=>`<div class="mu">${NM[t]} ${c(t)} / ${n(t)}</div>${bar(c(t)/n(t)*100)}`).join("")}<div class="mu">Mots appris ${Object.keys(S.lw).length} / ${W.length} · Quiz ${S.res.length}</div></div>
<div class="card"><b>À retravailler</b><div class="row">${wr.map(x=>`<span style="font-size:1.7rem">${x}</span>`).join("")||'<span class="mu">Rien pour l’instant.</span>'}</div></div>
<h2>Thèmes</h2>`+[["sakura","Sakura","#fff3f5","#e8335a"],["nuit","Nuit","#0e1220","#7c9cff"],["matcha","Matcha","#eaf2dc","#3b7a1c"],["encre","Encre","#fff","#000"]].map(x=>`<button class="sw" onclick="S.th='${x[0]}';save();theme();me()"><i style="background:linear-gradient(90deg,${x[2]} 50%,${x[3]} 50%)"></i>${x[1]}${S.th==x[0]?" ✓":""}</button>`).join("")+
`<div class="card"><b>Personnalisé</b>${[["bg","Fond"],["cd","Cartes"],["fg","Texte"],["ac","Accent"]].map(x=>`<label>${x[1]}<input type="color" value="${S.cu[x[0]]}" oninput="S.cu.${x[0]}=this.value;S.th='perso';save();theme()"></label>`).join("")}<button class="p w" onclick="S.th='perso';save();me()">${S.th=="perso"?"Thème perso actif ✓":"Activer mon thème"}</button></div>
<button class="w ${S.snd?"on":""}" onclick="S.snd=S.snd?0:1;save();me()">Bruitages ${S.snd?"activés":"désactivés"}</button><div class="row s"><button onclick="say('こんにちは')">Tester la voix</button><button onclick="tuto()">Revoir le tutoriel</button></div><div class="mu">${jv("ja-JP")?"Voix japonaise détectée.":"Aucune voix japonaise détectée : le son passera par Internet."}</div><h2>Réinitialiser</h2><div class="card"><div class="row">${Object.keys(RS).map(k=>`<button onclick="rst('${k}')">${RS[k][0]}</button>`).join("")}</div><button class="w" onclick="rst('all')">Tout réinitialiser</button></div>`}
